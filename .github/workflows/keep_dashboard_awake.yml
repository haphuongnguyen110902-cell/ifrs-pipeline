# Health check (and best-effort keep-alive) for the Streamlit Community Cloud
# dashboard.
#
# WHY THIS EXISTS: Streamlit Community Cloud's free tier puts an app to sleep
# after a period of inactivity - a cold visitor (e.g. a recruiter clicking the
# README's live-demo link) hits a "Zzzz... this app has gone to sleep" page.
#
# WHAT CHANGED (2026-09-19): the old version ran a plain `curl <url>` and never
# checked the result. The app answers a cookie-less request with a 303 redirect
# into Streamlit's auth handshake, so that curl never reached the app and the job
# reported success every 12 hours while the app was asleep. It now loads the page
# the way a browser does (scripts/check_dashboard.sh: cookie jar, follows
# redirects) and FAILS - so GitHub emails you - if the app is asleep or down.
#
# HONEST LIMITS: a page load is the best a free workflow can do, and I could not
# verify that it is enough to stop hibernation (only that it detects it). If the
# job keeps going red, the real fix is a host that does not sleep (e.g. Render,
# Fly.io, Hugging Face Spaces); delete this workflow once that migration happens.

name: Keep Dashboard Awake

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the check script)
        uses: actions/checkout@v4

      - name: Load the dashboard like a browser and fail if it is asleep or down
        run: bash scripts/check_dashboard.sh "https://haphuongnguyen110902-cell-ifrs-pipeline-webappapp-iwnn9s.streamlit.app/"
