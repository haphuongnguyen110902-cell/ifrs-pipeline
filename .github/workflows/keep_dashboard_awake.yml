# Keep-alive ping for the Streamlit Community Cloud dashboard.
#
# WHY THIS EXISTS: Streamlit Community Cloud's free tier puts an app to
# sleep after a period of inactivity - a cold visitor (e.g. a recruiter
# clicking the README's live-demo link) hits a "Zzzz... this app has gone
# to sleep" page instead of the dashboard, with a ~20-30s cold start even
# after clicking "wake up". That first impression is worse than the
# dashboard having a bug.
#
# STOPGAP, NOT A FIX: this just pings the URL often enough that Streamlit
# never considers the app idle. It does not solve the underlying problem
# (a free-tier host that sleeps at all) - see ROADMAP.md / CLAUDE.md's
# review notes for the real fix (migrate to a host that doesn't sleep,
# e.g. Render/Fly.io/Hugging Face Spaces). Delete this workflow once
# that migration happens; a ping cron is a permanent minor guilt tax on
# a free tier, not something to keep running forever if a better host is
# in place.
#
# Runs less often than Streamlit's idle timeout to be safe, but not so
# often it looks like abuse of the free tier.

name: Keep Dashboard Awake

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Streamlit app
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://haphuongnguyen110902-cell-ifrs-pipeline-webappapp-iwnn9s.streamlit.app/" \
            || echo "Ping failed - app may be asleep or URL changed. Not a fatal CI error."
