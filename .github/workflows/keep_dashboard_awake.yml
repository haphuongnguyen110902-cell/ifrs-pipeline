# Keep the public Streamlit Community Cloud dashboard awake, and fail loudly if it is down.
#
# WHY THIS EXISTS: Streamlit Community Cloud's free tier hibernates an app after about 12 hours without a browser
# session - a cold visitor (e.g. a recruiter clicking the README's live-demo link) then hits "This app has gone to
# sleep". The app is drawn by JavaScript inside an iframe, so a plain HTTP request sees the same 200 page whether it is
# awake or asleep: the earlier versions of this job (a bare `curl`, then an HTTP check with a cookie jar) were green
# every 6-12 hours while the app was found asleep (2026-09-21). This version loads it in a real headless browser
# (scripts/wake_dashboard.py), presses "Yes, get this app back up!" if it has to, requires the landing table to be
# drawn, and stays on the page briefly so the visit counts as traffic. It fails - and GitHub emails the owner - if the
# app does not come up.
#
# HONEST LIMITS: verified that the awake path works and that the page structure it relies on (title, iframe, landing
# text) matches the live app; the "press the wake button" path is covered by unit tests with a fake page and was checked
# by hand once, but it can only be exercised for real when the app has actually been put to sleep. If this job ever goes
# red, or the app still sleeps, the real fix is a host that does not sleep (Render, Fly.io, Hugging Face Spaces).

name: Keep Dashboard Awake

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (for the script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install a headless browser
        run: |
          python -m pip install "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium

      - name: Open the dashboard, wake it if it is asleep, fail if it does not come up
        run: python scripts/wake_dashboard.py "https://haphuongnguyen110902-cell-ifrs-pipeline-webappapp-iwnn9s.streamlit.app/"
