# IFRS Pipeline — scheduled automation (ROADMAP.md Phase 3)
#
# IMPORTANT: data/raw/* is gitignored (raw XBRL zips aren't committed -
# correctly, they're large binaries). This means a fresh GitHub Actions
# checkout has NONE of the source filings on disk. 'full'/'load'/
# 'historical' modes need those local files and will find nothing to
# parse in CI - they only make sense run manually on a machine that has
# the files. The scheduled (cron) trigger below always forces
# --mode analyze instead, which only reads from the already-populated
# Neon database (forensics/forecast/backtest) and needs no local files -
# this is what can genuinely run unattended every week.
#
# Requires GitHub secret: DATABASE_URL (your Neon connection string)
# Add it at: Settings → Secrets and variables → Actions → New repository secret

name: IFRS Pipeline

on:
  # Manual trigger - run from GitHub Actions tab anytime. 'full'/'load'/
  # 'historical' will find no local files to parse here (see note above)
  # - use 'analyze', 'ratios', or 'validate' for a meaningful CI run, or
  # trigger 'full' only if you've arranged for data/raw/*.zip to be
  # present some other way (e.g. a future automated-download step).
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode (full/load/historical need local files CI does not have - see workflow comments)'
        required: true
        default: 'analyze'
        type: choice
        options:
          - analyze
          - ratios
          - validate
          - full
          - load
          - historical
          - discover

  # Weekly scheduled runs - always 'analyze' (see note above for why)
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=analyze" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.mode || 'analyze' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python run_pipeline.py --mode ${{ steps.mode.outputs.value }} --skip-statements

      - name: Upload outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: data/raw/*.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed. Check the logs above."
          echo "Common causes:"
          echo "  - DATABASE_URL secret not set"
          echo "  - Ran 'full'/'load'/'historical' via workflow_dispatch: these need"
          echo "    data/raw/*.zip files that only exist on a developer's own machine,"
          echo "    not in a fresh CI checkout (data/raw/ is gitignored on purpose)"
          echo "  - New company has unmapped extension tags (human review required)"
          echo "  - Validation checks failed (mapping error)"
          exit 1
