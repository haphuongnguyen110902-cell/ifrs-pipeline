# Maps each downloaded filing to a proper company name and its expected
# reporting currency. The zip filename is the key (without .zip).
#
# expected_currency is a SANITY CHECK, not a conversion instruction - the
# loader reads the real currency from the filing itself. If they disagree,
# something is wrong (wrong entity downloaded, or the filing genuinely
# reports in a currency you didn't expect - worth knowing either way).
#
# Optional per-company fields: `fiscal_year_end: "June 30"`, and
# `reporting_model: financial` + `reporting_model_reason: "..."` to blank the
# ratios that are meaningless for a lender / insurer / payment processor when
# the free sector label (yfinance) misses it - see 11_ratio_engine.py.

