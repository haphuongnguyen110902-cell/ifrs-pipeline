# Maps each downloaded filing to a proper company name and its expected
# reporting currency. The zip filename is the key (without .zip).
#
# expected_currency is a SANITY CHECK, not a conversion instruction - the
# loader reads the real currency from the filing itself. If they disagree,
# something is wrong (wrong entity downloaded, or the filing genuinely
# reports in a currency you didn't expect - worth knowing either way).
#
# Optional per-company fields: `fiscal_year_end: "June 30"`, and
# `reporting_model: financial` + `reporting_model_reason: "..."` to blank the
# ratios that are meaningless for a lender / insurer / payment processor when
# the free sector label (yfinance) misses it - see 11_ratio_engine.py.

companies:
  loreal_2025:
    name: "L'Oreal"
    expected_currency: EUR
    sector: Consumer / Beauty
    country: France
  LVMH_2024:
    name: "LVMH"
    expected_currency: EUR
    sector: Luxury Goods
    country: France
  Kering_2023:
    name: "Kering"
    expected_currency: EUR
    sector: Luxury Goods
    country: France
    note: "FY2021-2023 only - download Kering_2025.zip for more recent data"
  essilorluxottica_new:
    name: "EssilorLuxottica"
    expected_currency: EUR
    sector: Consumer / Eyewear
    country: France
  puig:
    name: "Puig Brands"
    expected_currency: EUR
    sector: Consumer / Beauty
    country: Spain
  danone:
    name: "Danone"
    expected_currency: EUR
    sector: Consumer Staples
    country: France
  pernod_ricard:
    name: "Pernod Ricard"
    expected_currency: EUR
    sector: Consumer / Beverages
    country: France
    fiscal_year_end: "June 30"
    note: "FYE June 30 - comparisons with Dec 31 filers mix different economic periods"
  essity:
    name: "Essity"
    expected_currency: SEK
    sector: Consumer / Hygiene
    country: Sweden
  Moncler_2025:
    name: "Moncler"
    expected_currency: EUR
    sector: Luxury Apparel
    country: Italy
  Shell_2025:
    name: "Shell"
    expected_currency: USD
    sector: Energy
    country: United Kingdom
  Amplifon_2025:
    name: "Amplifon"
    expected_currency: EUR
    sector: Consumer Health Retail
    country: Italy
  heineken:
    name: "Heineken"
    expected_currency: EUR
    sector: Consumer / Beverages
    country: Netherlands
  schneider_electric_se:
    name: "Schneider Electric"
    expected_currency: EUR
    sector: Industrials / Electrical Equipment
    country: France
  adyen:
    name: "Adyen"
    expected_currency: EUR
    sector: Financials / Payments
    country: Netherlands
    reporting_model: financial
    reporting_model_reason: "payments processor - client money sits in payables to merchants and financial institutions (EUR 6.4bn vs EUR 0.3bn of trade payables at FY2025 in the loaded filing), so working-capital and leverage ratios are meaningless; yfinance labels it Technology, hence the explicit override"
  asm_international:
    name: "ASM International"
    expected_currency: EUR
    sector: Technology / Semiconductor Equipment
    country: Netherlands
  recordati:
    name: "Recordati"
    expected_currency: EUR
    sector: Healthcare / Pharmaceuticals
    country: Italy
