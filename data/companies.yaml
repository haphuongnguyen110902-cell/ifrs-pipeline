# Maps each downloaded filing to a proper company name and its expected
# reporting currency. The zip filename is the key (without .zip).
#
# expected_currency is a SANITY CHECK, not a conversion instruction - the
# loader reads the real currency from the filing itself. If they disagree,
# something is wrong (wrong entity downloaded, or the filing genuinely
# reports in a currency you didn't expect - worth knowing either way).

companies:
  loreal_2025:
    name: "L'Oreal"
    expected_currency: EUR
    sector: Consumer / Beauty
    country: France
  LVMH_2024:
    name: "LVMH"
    expected_currency: EUR
    sector: Luxury Goods
    country: France
  Kering_2023:
    name: "Kering"
    expected_currency: EUR
    sector: Luxury Goods
    country: France
    note: "FY2021-2023 only - download Kering_2025.zip for more recent data"
  essilorluxottica_new:
    name: "EssilorLuxottica"
    expected_currency: EUR
    sector: Consumer / Eyewear
    country: France
  puig:
    name: "Puig Brands"
    expected_currency: EUR
    sector: Consumer / Beauty
    country: Spain
  danone:
    name: "Danone"
    expected_currency: EUR
    sector: Consumer Staples
    country: France
  pernod_ricard:
    name: "Pernod Ricard"
    expected_currency: EUR
    sector: Consumer / Beverages
    country: France
    fiscal_year_end: "June 30"
    note: "FYE June 30 - comparisons with Dec 31 filers mix different economic periods"
  essity:
    name: "Essity"
    expected_currency: SEK
    sector: Consumer / Hygiene
    country: Sweden
  Moncler_2025:
    name: "Moncler"
    expected_currency: EUR
    sector: Luxury Apparel
