# Reviewed per-company corrections to the tag -> concept mapping.
#
# WHEN THIS FILE IS USED: a filer sometimes uses a standard IFRS tag for a line that is NOT what the tag means. The
# tag alone cannot show it - only the label the company prints next to the number can. An entry here applies to ONE
# company (matched by the name in data/companies.yaml), sits on top of ifrs_concepts_v0.yaml for that company only, and
# is applied by the loader (09_batch_load.py) and by the fact re-pointing tool (32_remap_facts.py). The fact keeps its
# original tag in fact_value.raw_xbrl_tag, so nothing is lost and every override can be audited.
#
# EVERY ENTRY MUST CARRY: the label the company itself prints (printed_label) and the evidence (where it was read).
# Never add one from a tag name alone, and never from a language-model guess: read the company's own statement.
#
# Format: company, tag, concept (normalized name), statement, label, printed_label, evidence.
# Optional: dashboard_note - one plain-language sentence the dashboard shows beside a figure read through this entry.
# It is company-specific on purpose (the dashboard's own wording stays generic), and may only state what the evidence
# above it states.
# checked_years (required for an entry that feeds capex): the fiscal years in which the company's line was verified
# against the IFRS measure it stands in for. The 3-statement model's base year moves forward every year; when it is not
# in this list, the dashboard says the year has not been checked instead of claiming it was.

overrides:

  # Puig Brands - FY2024 consolidated balance sheet (Spanish ESEF report 549300OVHNSX30L1AQ94-20241231-es.xhtml).
  # Puig swapped two tags: trade payables sit under the income-tax-liability tag and the income-tax payable under the
  # trade-and-other-payables tag. Read from the report's own balance sheet rows and the cash-flow working-capital note.
  # Effect before the fix: the ratio engine read 47.6M ("trade payables") -> DPO 14 days; the trade payables the company
  # prints are 229.5M -> about 64 days.
  - company: "Puig Brands"
    tag: "ifrs-full:CurrentTaxLiabilitiesCurrent"
    concept: trade_and_other_current_payables_to_trade_suppliers
    statement: balance_sheet
    label: Trade Payables
    printed_label: "Proveedores y acreedores"
    evidence: >-
      Balance sheet 31 Dec 2024 / 2023 (EUR thousands): the row "Proveedores y acreedores" 229,492 / 212,072 is tagged
      ifrs-full:CurrentTaxLiabilitiesCurrent. The consolidated note "Cambios en el capital circulante" lists the same
      caption "Proveedores y acreedores" as a working-capital movement (5,826) beside "Otras cuentas a pagar a corto plazo".
      Read 2026-09-21 with scripts/reconcile_reports.py and the report's row labels.

  - company: "Puig Brands"
    tag: "ifrs-full:TradeAndOtherCurrentPayables"
    concept: current_tax_liabilities_current
    statement: balance_sheet
    label: Current Tax Liabilities
    printed_label: "Impuesto sobre sociedades a pagar"
    evidence: >-
      Balance sheet 31 Dec 2024 / 2023 (EUR thousands): the row "Impuesto sobre sociedades a pagar" (corporate income tax
      payable) 47,625 / 55,319 is tagged ifrs-full:TradeAndOtherCurrentPayables. Read 2026-09-21 with
      scripts/reconcile_reports.py and the report's row labels.

  # LVMH - FY2024 universal registration document, consolidated cash flow statement and note 15.3 "Investissements
  # d'exploitation" (French ESEF report IOG4E947OATN0KJYSD45-2024-12-31-0-fr.xhtml). LVMH's face statement prints ONE line,
  # "Investissements d'exploitation" (operating investments), and note 15.3 breaks it down (EUR millions):
  #                                                              2024     2023     2022
  #   Acquisitions of intangible assets (note 3)                 (837)  (1,000)    (685)
  #   Acquisitions of PP&E (note 6)                            (4,715)  (6,807)  (4,397)
  #   Cash effect of fixed-asset acquisitions (after the change in fixed-asset suppliers)
  #                                                            (5,519)  (7,536)  (4,948)   <- IAS 7.16(a) gross payments
  #   Cash effect of fixed-asset disposals                          21      136       73
  #   Guarantee deposits and other operating investing flows      (33)     (78)     (94)
  #   Operating investments (the line tagged below)            (5,531)  (7,478)  (4,969)
  # So the company-defined line differs from the gross IAS 7.16(a) payments by +12 / -58 / +21 (0.2% / 0.8% / 0.4%):
  # disposals and deposits are tiny. Used as capex because it is what the company defines and reports (it drives its
  # own "cash flow disponible d'exploitation"), it is within 1% of the gross measure IAS 7.16(a) / 7.21 ask for, and
  # the gross figure itself is not XBRL-tagged (note 15.3 has no tags), so it cannot be read from the facts. Note that
  # IAS 7.21 asks for gross receipts and payments to be reported separately: LVMH's face line is net and its gross
  # split is in the note - a presentation point for the company and its auditors, not something this pipeline judges.
  - company: "LVMH"
    tag: "LVM:OperatingInvestmentsClassifiedAsInvestingActivities"
    concept: purchase_of_property_plant_and_equipment_and_intangible_asse_etc
    statement: cash_flow
    label: Purchase of property plant and equipment and intangible assets
    printed_label: "Investissements d'exploitation"
    evidence: >-
      Cash flow statement and note 15.3 of the FY2024 report: operating investments (5,531) = cash effect of fixed-asset
      acquisitions (5,519) + cash effect of disposals 21 + guarantee deposits and other (33); acquisitions of
      intangibles (837) and PP&E (4,715) before the change in fixed-asset suppliers. 2023: (7,478) vs (7,536) gross;
      2022: (4,969) vs (4,948) gross. Company-defined, within 1% of the IAS 7.16(a) gross payments in all three years.
      Read 2026-09-21 from the report's own rows. FY2025 report (BDIF D.26-0195), note 15.3: (4,567) vs gross (4,595) =
      intangibles (819) + PP&E (3,851) + suppliers 63 + lease set-up 12; disposals 38, deposits (10): 0.6%, within 1%.
      FY2021 report (PDF-layout XHTML, same note): 2021 (2,664) vs gross (3,071) - 13.3% below, because disposal
      proceeds of 444 (mainly the sale of the Belmond Charleston hotel) are netted in; 2020 (2,478) vs (2,526) - 1.9%;
      2019 (3,294) vs (3,287) - 0.2%. So the company-defined line stands in for IFRS capex only in checked_years; 2020 and
      2021 fail the 1% test (read 2026-09-23; the FY2022 report restates 2021 and 2020 identically).
    checked_years: [2019, 2022, 2023, 2024, 2025]
    dashboard_note: >-
      LVMH's own note splits this line into gross purchases of property, plant, equipment and intangible assets,
      disposal proceeds and deposits; the line was within 1% of the gross purchases in each of 2022, 2023, 2024 and 2025
      (2025: EUR 4,567M vs 4,595M).

  # Kering - FY2023 URD, consolidated cash flow statement and note 3.1 (segment information / EBITDA reconciliation, French
  # ESEF report kering-2023-12-31-fr.xhtml). The cash-flow line "Dotations nettes courantes aux amortissements et provisions
  # sur actifs opérationnels non courants" (1,823M in 2023, 1,666M in 2022) is tagged with an extension element that the
  # filer anchors to depreciation/amortisation AND provisions, so by its tag it looked bundled. Its own label and the
  # company's EBITDA reconciliation say what it is: it is the D&A charge on NON-CURRENT OPERATING ASSETS (PP&E, intangibles,
  # right-of-use - "dont amortissement des droits d'utilisation" 985 / 935) net of impairment provisions on those assets, not a
  # provision for liabilities or inventories. Kering defines EBITDA as recurring operating income + exactly this line:
  # 4,746 + 1,823 = 6,569 (2023); 5,589 + 1,666 = 7,255 (2022). Perimeter: depreciation, amortisation and net impairment /
  # provisions on non-current operating assets (the same "D&A and impairment" perimeter as Danone, Heineken, ASM).
  - company: "Kering"
    tag: "kering:AdjustmentsForDepreciationAndAmortisationAndProvisionExpense"
    concept: adjustments_for_depreciation_and_amortisation_expense_and_etc
    statement: cash_flow
    label: Depreciation, Amortization and Impairment Adjustments
    printed_label: "Dotations nettes courantes aux amortissements et provisions sur actifs opérationnels non courants"
    evidence: >-
      Kering FY2023 report, note 3.1 EBITDA reconciliation: recurring operating income 4,746 + net current depreciation,
      amortisation and provisions on non-current operating assets 1,823 (of which right-of-use amortisation 985) = EBITDA
      6,569; 2022: 5,589 + 1,666 (935) = 7,255. The line therefore is the D&A the company itself adds back to reach EBITDA.
      Read 2026-09-21 from the report's own rows.

