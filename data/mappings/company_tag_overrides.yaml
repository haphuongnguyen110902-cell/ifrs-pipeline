  # ---- Banks (Phase 4, 2026-09-28). The inputs of FINANCIAL_RATIO_META (cost/income, cost of risk, loans/deposits,
  # equity/assets) as each bank prints them. Italian banks use the Bank of Italy Circular 262 layout: "120. Margine di
  # intermediazione" is the total operating income and "240. Costi operativi" the operating costs (administrative expenses,
  # net provisions for risks, depreciation and amortisation, other operating income and charges). Their "crediti verso
