# Reviewed figures read from the NOTES of an annual report (see scripts/33_load_note_facts.py).
#
# WHEN THIS FILE IS USED: a company prints a figure clearly in a note table (or in its own EBITDA reconciliation) but does
# not tag it in XBRL - most notes of an ESEF report are only block-tagged - so the figure is missing from the facts. This is
# a REVIEWED SPECIFICATION of where to read it; the numbers themselves are read from the report by code, refused unless
# their checks pass, and stored as facts with raw_xbrl_tag "note:<id>" and context_ref "<report>#row<n>".
#
# EVERY ENTRY: report (file name of the ESEF package), row (regular expression on the printed row label), years (how the
# fiscal years are identified: "header" = a header row of years above the row, or a list of years, newest first, one per
# matching row), column ("all" = one value per header year, "last" = the last number of each row), scale (units of the table),
# decimal ("," or "."), concept (the normalised concept the engine reads), the perimeter of the figure, at least one check,
# and the evidence. Never add one from a label alone or from a language-model guess: read the report's own table.
#
# Checks: sane_pct_of_revenue [lo, hi]; cross_row_equals_tagged_fact {row, tag, row_offset} (a neighbouring row of the same
# table must equal a TAGGED fact of the same report - this proves the row/year mapping); ebitda_bridge {start, end,
# tolerance} (the company's own EBITDA reconciliation: start + the rows between = end, and end - start = the figure).

figures:

  # ---------------------------------------------------------------------------------------------------------------- LVMH
  # Segment note of the consolidated financial statements: one table per year (newest first), total column last.
  # "Charges d'amortissement et de dépréciation" = depreciation, amortisation and impairment of intangible assets, PP&E and
  # right-of-use assets charged in the year; "Dont : Droits d'utilisation" is the IFRS 16 part and equals the tagged
  # cash-flow line AdjustmentsForDepreciationRightOfUseAssets (3,228 / 3,031 / 3,007), which proves the year mapping.
  # Perimeter note: the impairment of brands and goodwill booked in "Autres produits et charges opérationnels" (422M in 2024)
  # is NOT in this line, so EBITDA computed as operating profit + this line is slightly conservative.
  - id: lvmh_da_note_fy2024
    company: "LVMH"
    report: lvmh_2024-12-31.zip
    row: '^Charges d.amortissement et de dépréciation$'
    years: [2024, 2023, 2022]
    column: last
    scale: 1000000
    decimal: ","
    currency: EUR
    concept: adjustments_for_depreciation_and_amortisation_expense_and_etc
    statement: cash_flow
    label: Depreciation, Amortization and Impairment Adjustments
    perimeter: "depreciation, amortisation and impairment of intangibles, PP&E and right-of-use assets (segment note total)"
    checks:
      - sane_pct_of_revenue: [3, 12]
      - cross_row_equals_tagged_fact: {row: '^Dont : Droits d.utilisation$', tag: "LVM:AdjustmentsForDepreciationRightOfUseAssets", row_offset: 1}
    evidence: >-
      FY2024 report, segment information: "Charges d'amortissement et de dépréciation" (6,702) 2024, (6,018) 2023, (5,772) 2022
      in EUR millions, of which right-of-use assets (3,228) / (3,031) / (3,007) = the tagged cash-flow line. Recurring
      operating profit 19,571 + other operating items (664) = operating profit 18,907 (the EBIT used here).

  - id: lvmh_da_note_fy2023
    company: "LVMH"
    report: lvmh_2023-12-31.zip
    row: '^Charges d.amortissement et de dépréciation$'
    years: [2023, 2022, 2021]
    column: last
    scale: 1000000
    decimal: ","
    currency: EUR
    concept: adjustments_for_depreciation_and_amortisation_expense_and_etc
    statement: cash_flow
    label: Depreciation, Amortization and Impairment Adjustments
    perimeter: "depreciation, amortisation and impairment of intangibles, PP&E and right-of-use assets (segment note total)"
    checks:
      - sane_pct_of_revenue: [3, 12]
      - cross_row_equals_tagged_fact: {row: '^Dont : Droits d.utilisation$', tag: "LVM:AdjustmentsForDepreciationRightOfUseAssets", row_offset: 1, min_verified: 2}
    evidence: >-
      FY2023 report, same segment table: (6,018) 2023, (5,772) 2022, (5,253) 2021; right-of-use (3,031) / (3,007) / (2,698).

  # ------------------------------------------------------------------------------------------------------------- L'Oreal
  # Note on fixed assets: "Dotations aux amortissements des immobilisations corporelles et incorporelles" with the IFRS 16
  # part on the next line. Depreciation and amortisation only - impairment of tangible and intangible assets is a separate
  # line (- / 50.8 / 270.6), so this is D&A without impairment. It is the item L'Oreal's own EBITDA definition adds back
  # ("resultat d'exploitation retraite des charges d'amortissements recurrents et provisions pour depreciations des actifs
  # immobilises (immobilisations corporelles, incorporelles, droits d'utilisation)").
  - id: loreal_da_note_fy2025
    company: "L'Oreal"
    report: loreal_2025-12-31.zip
    row: '^Dotations aux amortissements des immobilisations corporelles et incorporelles$'
    years: header
    column: all
    scale: 1000000
    decimal: ","
    currency: EUR
    concept: adjustments_for_depreciation_and_amortisation_expense
    statement: cash_flow
    label: Adjustments for depreciation and amortisation expense
    perimeter: "depreciation and amortisation of PP&E, intangibles and IFRS 16 right-of-use assets; impairment is a separate line"
    checks:
      - sane_pct_of_revenue: [2, 8]
    evidence: >-
      FY2025 report, note on fixed assets: 1,652.4 (2025), 1,586.7 (2024), 1,429.7 (2023) EUR millions, of which IFRS 16
      right-of-use 482.5 / 474.5 / 426.0. The tagged cash-flow line "amortissements, provisions et passifs d'impôts non
      courants" (1,817.4 / 1,855.3 / 1,715.0) is the bundled superset.

  - id: loreal_da_note_fy2024
    company: "L'Oreal"
    report: loreal_2024-12-31.zip
    row: '^Dotations aux amortissements des immobilisations corporelles et incorporelles$'
    years: header
    column: all
    scale: 1000000
    decimal: ","
    currency: EUR
    concept: adjustments_for_depreciation_and_amortisation_expense
    statement: cash_flow
    label: Adjustments for depreciation and amortisation expense
    perimeter: "depreciation and amortisation of PP&E, intangibles and IFRS 16 right-of-use assets; impairment is a separate line"
    checks:
      - sane_pct_of_revenue: [2, 8]
    evidence: >-
      FY2024 report, same note: 1,586.7 (2024), 1,429.7 (2023), 1,474.2 (2022); right-of-use 474.5 / 426.0 / 428.0.

  # --------------------------------------------------------------------------------------------------------------- Essity
  # The FY2023 and FY2024 reports do not tag their cash-flow D&A line (FY2020-FY2022 did). The cash-flow statement prints
  # "Av- och nedskrivningar av anläggningstillgångar" = depreciation AND impairment of fixed assets, and the company's own
  # EBITDA reconciliation confirms it: operating profit 18,295 + 7,505 = EBITDA 25,800 (2024). Includes right-of-use
  # depreciation (1,089), amortisation of acquisition-related intangibles (1,110) and impairments (incl. items affecting
  # comparability).
  - id: essity_da_note_fy2024
    company: "Essity"
    report: essity_2024-12-31.zip
    row: '^Av- och nedskrivningar av anläggningstillgångar$'
    years: header
    column: all
    scale: 1000000
    decimal: ","
    currency: SEK
    concept: adjustments_for_depreciation_and_amortisation_expense_and_etc
    statement: cash_flow
    label: Depreciation, Amortization and Impairment Adjustments
    perimeter: "depreciation, amortisation (incl. acquisition-related intangibles and right-of-use) and impairment of fixed assets"
    checks:
      - sane_pct_of_revenue: [3, 9]
      - ebitda_bridge: {start: '^Rörelseresultat$', end: '^EBITDA$', tolerance: 1}
    evidence: >-
      FY2024 report, cash flow statement: 7,505 (2024), 7,998 (2023), 9,012 (2022) SEK millions. EBITDA reconciliation:
      operating profit 18,295 / 15,148 / 8,491 + amortisation of acquisition-related intangibles 1,110 + depreciation 5,028
      + right-of-use 1,089 + impairment 56 + IAC impairment 152 + IAC acquisition-related 70 = EBITDA 25,800 / 23,146 / 17,502.

  # ----------------------------------------------------------------------------------------------- ASM International
  # ASM has no borrowings: its FY2025 report says "As per December 31, 2025, ASM was debt-free" and "the amount outstanding as at
  # December 31, 2025 was nil" (the EUR 150M revolving facility and the EUR 15M overdraft line are undrawn), and its balance
  # sheet has no line of that nature in any year. Without a debt line the net-debt rule stayed blank ("never a guess"), so ASM
  # had no net debt / EBITDA, ROIC, credit band or DCF although its cash (1,026.9M) is printed. The only financial-debt items
  # are its IFRS 16 lease liabilities: current 13.9 / 11.7M (printed in note 15, accrued expenses and other payables) and
  # non-current 19.6 / 25.0M (printed as "Non-current lease liabilities" in the contractual-obligations table of note 18; that
  # table is a maturity analysis, so the figure can be slightly above the discounted carrying amount, which sits inside
  # "Other liabilities" 64.0 / 23.6M and is not printed separately - immaterial: about 3% of cash). Contingent consideration
  # payable (18.4M non-current, 97.0M current in 2024) is a payable for an acquisition, not borrowing, and is not counted.
  # Only FY2025 and FY2024 are covered: the older reports are not on this machine, so 2019-2023 stay blank.
  - id: asm_lease_current_fy2025
    company: "ASM International"
    report: asm_international.zip
    row: '^Current lease liabilities$'
    years: header
    column: all
    scale: 1000000
    decimal: "."
    currency: EUR
    period: instant
    concept: current_lease_liabilities
    statement: balance_sheet
    label: Current lease liabilities
    perimeter: "IFRS 16 lease liabilities due within one year, as printed in note 15 (accrued expenses and other payables)"
    checks:
      - sane_pct_of_tagged_fact: {tag: "ifrs-full:Assets", range: [0, 3]}
      - cross_row_equals_tagged_fact: {row: '^Total accrued expenses and other payables$', tag: "ifrs-full:CurrentAccruedExpensesAndOtherCurrentLiabilities", row_offset: 3, tolerance: 0.001}
    evidence: >-
      FY2025 report, note 15: current lease liabilities 13.9 (2025) and 11.7 (2024) EUR millions, inside "Accrued expenses and
      other payables" 197.0 / 235.3 (the note's total equals the tagged balance-sheet line).

  - id: asm_lease_noncurrent_fy2025
    company: "ASM International"
    report: asm_international.zip
    row: '^Non-current lease liabilities$'
    min_values: 3
    years: [2025, 2024]
    column: first
    scale: 1000000
    decimal: "."
    currency: EUR
    period: instant
    concept: noncurrent_lease_liabilities
    statement: balance_sheet
    label: Non-current lease liabilities
    perimeter: "IFRS 16 lease liabilities due after one year, as printed in the contractual-obligations table of note 18 (maturity analysis)"
    checks:
      - sane_pct_of_tagged_fact: {tag: "ifrs-full:Assets", range: [0, 3]}
      - cross_row_equals_tagged_fact: {row: '^Accrued expenses and other payables$', tag: "ifrs-full:CurrentAccruedExpensesAndOtherCurrentLiabilities", row_offset: -1, column: first, tolerance: 0.001}
    evidence: >-
      FY2025 report, note 18 contractual obligations: non-current lease liabilities 19.6 (2025; 16.7 in 1-5 years, 2.9 later)
      and 25.0 (2024; 21.4, 3.7). The row above each (accrued expenses and other payables 197.0 / 235.3) equals the tagged
      balance-sheet line, which proves which table belongs to which year.

  - id: asm_no_noncurrent_borrowings_2025
    kind: stated_zero
    company: "ASM International"
    report: asm_international.zip
    years: [2025]
    period: instant
    currency: EUR
    concept: longterm_borrowings
    statement: balance_sheet
    label: Long-term borrowings
    perimeter: "no borrowings: the company states it was debt-free at 31 December 2025"
    checks:
      - report_states: 'ASM was debt-free'
      - report_states: 'amount outstanding as at December 31, 2025 was nil'
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'borrow|loan|debt|bond|overdraft|credit facilit'}
    evidence: >-
      FY2025 report: note 17 "As per December 31, 2025, ASM was debt-free ... The amount outstanding as at December 31, 2025
      was nil, so the undrawn portion totaled EUR 150 million" (revolving credit facility) and EUR 15 million overdraft line
      also nil; note 18 "the company had no debt and was not exposed to interest rate risk on borrowings"; key figures "EUR
      1,027 million cash position, no debt". The balance sheet has no borrowing line.

  - id: asm_no_current_borrowings_2025
    kind: stated_zero
    company: "ASM International"
    report: asm_international.zip
    years: [2025]
    period: instant
    currency: EUR
    concept: shortterm_borrowings
    statement: balance_sheet
    label: Short-term borrowings
    perimeter: "no borrowings: the company states it was debt-free at 31 December 2025"
    checks:
      - report_states: 'ASM was debt-free'
      - report_states: 'amount outstanding as at December 31, 2025 was nil'
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'borrow|loan|debt|bond|overdraft|credit facilit'}
    evidence: >-
      Same statements as asm_no_noncurrent_borrowings_2025 (revolving facility and overdraft line undrawn at 31 December 2025).

  # 2024: the FY2025 report has no sentence about 31 December 2024, so the zero rests on the structure of its own statements:
  # the balance sheet (2025 and 2024 columns) and the five-year summary (2021-2025) have no borrowing line, and the cash-flow
  # statement shows no borrowing or repayment in 2025 or 2024 (financing: lease payments, treasury shares, dividends only).
  - id: asm_no_noncurrent_borrowings_2024
    kind: stated_zero
    company: "ASM International"
    report: asm_international.zip
    years: [2024]
    period: instant
    currency: EUR
    concept: longterm_borrowings
    statement: balance_sheet
    label: Long-term borrowings
    perimeter: "no borrowing line on the balance sheet at 31 December 2024 and no borrowing flow in 2024-2025 (IAS 1.54(m) requires financial liabilities on the face)"
    checks:
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'borrow|loan|debt|bond|overdraft|credit facilit'}
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'borrow|loan|debt|bond|overdraft|credit facilit', occurrence: 2}
      - no_row_matching: {from: '^Cash flows from financing activities$', to: '^Net cash used in financing activities$', pattern: 'borrow|loan|debt|repay|proceeds|credit facilit'}
    evidence: >-
      FY2025 report: balance sheet 31 Dec 2025 / 2024 (liabilities: other liabilities, contingent consideration, deferred tax,
      accounts payable, warranty, income taxes, contract liabilities, accrued expenses); five-year summary 2021-2025 likewise
      without a borrowing line; financing cash flows 2025 / 2024: payment of lease liabilities, purchase of treasury shares,
      dividends - no borrowing or repayment. The 2024 financial-instruments table lists no borrowings either.

  - id: asm_no_current_borrowings_2024
    kind: stated_zero
    company: "ASM International"
    report: asm_international.zip
    years: [2024]
    period: instant
    currency: EUR
    concept: shortterm_borrowings
    statement: balance_sheet
    label: Short-term borrowings
    perimeter: "no borrowing line on the balance sheet at 31 December 2024 and no borrowing flow in 2024-2025"
    checks:
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'borrow|loan|debt|bond|overdraft|credit facilit'}
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'borrow|loan|debt|bond|overdraft|credit facilit', occurrence: 2}
      - no_row_matching: {from: '^Cash flows from financing activities$', to: '^Net cash used in financing activities$', pattern: 'borrow|loan|debt|repay|proceeds|credit facilit'}
    evidence: >-
      Same structural evidence as asm_no_noncurrent_borrowings_2024.

  # ASM prints ONE combined "Equity" line (ifrs-full:Equity, already tagged and loaded) for every year shown - the
  # consolidated balance sheet, the five-year summary (2021-2025) and the statement of changes in equity's own column
  # headers (Common shares, Capital in excess of par value, Treasury shares at cost, Retained earnings, Other reserves,
  # Total equity) - never a split into "attributable to owners of the parent" and "non-controlling interests". The
  # consolidation accounting-policy note only says NCI "is disclosed separately, where appropriate" - conditional
  # boilerplate describing what ASM WOULD do if a partly-owned subsidiary existed, not a disclosure that one does. With
  # no NCI line anywhere across five years of statements, ASM is treated as having none, which lets ROIC and ROE be
  # computed: 11_ratio_engine.py's ROIC/ROE fall back to the tagged total "Equity" as equity attributable to owners of
  # the parent only when noncontrolling_interests is a PROVEN zero (this note figure), never merely missing - a company
  # that just doesn't tag the split stays blank, as before.
  - id: asm_no_noncontrolling_interests_2025
    kind: stated_zero
    company: "ASM International"
    report: asm_international.zip
    years: [2025]
    period: instant
    currency: EUR
    concept: noncontrolling_interests
    statement: balance_sheet
    label: Non-controlling Interests
    perimeter: "no non-controlling interests: the balance sheet, the five-year summary and the equity statement print one combined 'Equity' line with no NCI split"
    checks:
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'non.controlling|minority'}
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'non.controlling|minority', occurrence: 2}
    evidence: >-
      FY2025 report: consolidated balance sheet (note 12) prints one line "Equity" 4,005.8 (2025) / 3,747.2 (2024), no
      "non-controlling interests" or "attributable to owners of the parent" row; the five-year summary (2021-2025) repeats
      the same single "Equity" line for all five years (2,241.8 / 2,749.3 / 3,226.8 / 3,747.2 / 4,005.8); the statement of
      changes in equity's columns are Common shares, Capital in excess of par value, Treasury shares at cost, Retained
      earnings, Other reserves, Total equity - no non-controlling-interests column. The consolidation policy note states
      NCI "is disclosed separately, where appropriate" (conditional boilerplate, not an actual balance).

  - id: asm_no_noncontrolling_interests_2024
    kind: stated_zero
    company: "ASM International"
    report: asm_international.zip
    years: [2024]
    period: instant
    currency: EUR
    concept: noncontrolling_interests
    statement: balance_sheet
    label: Non-controlling Interests
    perimeter: "no non-controlling interests at 31 December 2024: same balance sheet and five-year summary as the 2025 entry"
    checks:
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'non.controlling|minority'}
      - no_row_matching: {from: '^Equity and liabilities$', to: '^Total equity and liabilities$', pattern: 'non.controlling|minority', occurrence: 2}
    evidence: >-
      Same statements as asm_no_noncontrolling_interests_2025 (both years appear side by side on the same balance sheet
      and across all five years of the summary table).
